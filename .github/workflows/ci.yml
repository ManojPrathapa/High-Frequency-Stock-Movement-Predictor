name: Stock Predictor CI & CML Report

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  evaluate-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull Versioned Test Data via DVC
        run: |
          dvc pull

      - name: Re-link MLflow SQLite Paths for CI Runner
        run: |
          python -c "
          import sqlite3, os, re
          conn = sqlite3.connect('mlflow.db')
          c = conn.cursor()
          
          # Target path on GitHub Actions runner
          target_dir = os.path.abspath('mlruns')
          target_file_uri = 'file://' + target_dir
          
          def fix_path(val, use_file_prefix=True):
              if not val:
                  return val
              replacement = target_file_uri if use_file_prefix else target_dir
              # Replace anything before /mlruns with the runner target
              if '/mlruns' in val:
                  return re.sub(r'^.*?(/mlruns.*)$', replacement + r'\1', val).replace('/mlruns/mlruns', '/mlruns')
              return val
          
          # Update runs table
          c.execute('SELECT run_uuid, artifact_uri FROM runs')
          for run_id, uri in c.fetchall():
              c.execute('UPDATE runs SET artifact_uri = ? WHERE run_uuid = ?', (fix_path(uri, True), run_id))
              
          # Update model_versions table (source column)
          c.execute('SELECT name, version, source FROM model_versions')
          for name, ver, src in c.fetchall():
              c.execute('UPDATE model_versions SET source = ? WHERE name = ? AND version = ?', (fix_path(src, True), name, ver))
              
          # Update experiments table
          c.execute('SELECT experiment_id, artifact_location FROM experiments')
          for exp_id, loc in c.fetchall():
              c.execute('UPDATE experiments SET artifact_location = ? WHERE experiment_id = ?', (fix_path(loc, True), exp_id))
              
          conn.commit()
          conn.close()
          print('MLflow SQLite database successfully re-linked to runner directory!')
          "

      - name: Run CI Evaluation & Feature Sanity Tests (MLflow Model Registry)
        run: |
          python eval_ci.py

      - name: Post CML Comment on PR / Commit
        uses: iterative/setup-cml@v2
        with:
          version: '1.x'
      - name: Send CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md --pr || cml comment create report.md --commit
