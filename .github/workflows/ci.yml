name: Stock Predictor CI & CML Report

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  evaluate-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull Versioned Test Data via DVC
        run: |
          dvc pull

      - name: Run MLflow Hyperparameter Sweep & Register Model Natively
        run: |
          rm -rf mlflow.db mlruns/ mlartifacts/
          python tune_and_register.py

      - name: Run CI Evaluation & Feature Sanity Tests
        run: |
          python eval_ci.py

      - name: Install CML CLI via NPM
        run: |
          npm install -g @dvcorg/cml

      - name: Send CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md --pr || cml comment create report.md --commit
