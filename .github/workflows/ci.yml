name: Stock Predictor CI & CML Report

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  evaluate-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn pandas numpy matplotlib mlflow dvc

      - name: Pull Versioned Test Data via DVC
        run: |
          dvc pull || echo "Local DVC files already present in checkout"

      - name: Run CI Evaluation & Feature Sanity Tests
        run: |
          python eval_ci.py

      - name: Post CML Comment on PR / Commit
        uses: iterative/setup-cml@v2
        with:
          version: '1.x'
      - name: Send CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md --pr || cml comment create report.md --commit
