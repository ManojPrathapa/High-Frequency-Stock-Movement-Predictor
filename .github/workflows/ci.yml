name: Stock Predictor CI & CML Report

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  evaluate-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull Versioned Test Data via DVC
        run: |
          dvc pull

      - name: Patch MLflow SQLite Paths for CI Environment
        run: |
          python -c "
          import sqlite3, os
          conn = sqlite3.connect('mlflow.db')
          c = conn.cursor()
          old_path = '/home/manoj_prathapa23/23F1001473_IITMBS_MLOPS_OPPE1_MAY_2026'
          new_path = os.getcwd()
          c.execute('UPDATE runs SET artifact_uri = REPLACE(artifact_uri, ?, ?)', (old_path, new_path))
          c.execute('UPDATE model_versions SET source = REPLACE(source, ?, ?)', (old_path, new_path))
          conn.commit()
          conn.close()
          "

      - name: Run CI Evaluation & Feature Sanity Tests (MLflow Model Registry)
        run: |
          python eval_ci.py

      - name: Post CML Comment on PR / Commit
        uses: iterative/setup-cml@v2
        with:
          version: '1.x'
      - name: Send CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md --pr || cml comment create report.md --commit
